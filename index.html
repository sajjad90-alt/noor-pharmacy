const AM={'أ':'ا','إ':'ا','آ':'ا','ى':'ي','ة':'ه','ؤ':'و','ئ':'ي','ء':'','ق':'ك','ث':'س','ص':'س','ز':'س','ذ':'د','ض':'د','ظ':'د','ط':'ت'};
function norm(t){t=t.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآىةؤئءقثصزذضظط]/g,c=>AM[c]).replace(/ph/g,'f').replace(/ck/g,'k').replace(/ee/g,'i').replace(/o[ou]/g,'u').replace(/x/g,'ks').replace(/[pb]/g,'b').replace(/v/g,'f').replace(/[cq]/g,'k').replace(/z/g,'s').replace(/y/g,'i');
 return t.replace(/[^a-z0-9\u0621-\u064A]+/g,' ').replace(/([a-z\u0621-\u064A])\1+/g,'$1').trim()}
function ed(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function tsc(q,t){if(t.startsWith(q))return 1;if(/^\d/.test(q))return 0;if(q.length<3)return 0;if(t.includes(q))return .85;
 const a=1-ed(q,t)/Math.max(q.length,t.length),p=t.slice(0,q.length),b=(1-ed(q,p)/q.length)*.95;return Math.max(a,b)}
function smart(items,q,fn){const qt=norm(q).split(' ').filter(Boolean);if(!qt.length)return{list:items,fuzzy:false};
 const sc=items.map(x=>{const nt=norm(fn(x)).split(' ');return{x,s:qt.reduce((a,w)=>a+Math.max(0,...nt.map(t=>tsc(w,t))),0)/qt.length}}).sort((a,b)=>b.s-a.s);
 let r=sc.filter(o=>o.s>=.6);if(!r.length)r=sc.filter(o=>o.s>=.45).slice(0,3);
 return{list:r.map(o=>o.x),fuzzy:r.length>0&&r[0].s<.85}}

 $('l').innerHTML=msg+(r.length?r.map(d=>`<div class="glass row ${d.av?'':'na'}"><div style="display:flex;gap:8px;align-items:center">${thumb(d)}<div><b>${d.name}</b><br><small>${d.note||''}</small></div></div>${d.av?`<button onclick="add('${d.id}')">+ أضف</button>`:'<small>غير متوفر</small>'}</div>`).join(''):'<div class="glass row">لا توجد نتائج — يمكنك طلبه عبر واتساب</div>')}
function add(id){const i=cart.find(c=>c.id==id);i?i.n++:cart.push({id,n:1});$('cc').textContent=`(${cart.length})`}
function cartV(){
 $('main').innerHTML=`<h3>🛒 سلتي</h3>`+(cart.length?cart.map((c,i)=>{const d=all().find(x=>x.id==c.id)||{name:'؟'};return `<div class="glass row"><div><b>${d.name}</b></div><span class="q"><button onclick="cart[${i}].n++;draw()">+</button> ${c.n} <button onclick="if(--cart[${i}].n<1)cart.splice(${i},1);draw()">−</button></span></div>`}).join('')+`<div class="glass" style="padding:14px">
 <input id="ph" type="tel" placeholder="📱 رقم هاتفك" value="${localStorage.ph||''}"><input id="lo" placeholder="📍 موقعك / عنوانك"><button onclick="gps()" style="width:100%;margin-bottom:8px">📍 تحديد موقعي تلقائياً</button>
 <button class="w" onclick="send()">إرسال الطلب عبر واتساب</button></div>`:'<div class="glass row">السلة فارغة</div>')}
function gps(){navigator.geolocation.getCurrentPosition(p=>$('lo').value=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`,()=>toast('فعّل خدمة الموقع'),{enableHighAccuracy:true})}
function send(){const ph=$('ph').value.trim(),lo=$('lo').value.trim();if(!S.wa)return toast('رقم الواتساب غير مضبوط من الإدارة');if(!ph||!lo)return toast('أدخل رقم الهاتف والموقع');localStorage.ph=ph;
 const ls=cart.map(c=>{const d=all().find(x=>x.id==c.id)||{name:'؟'};return `• ${d.name} × ${c.n}`}).join('\n');
 const msg=`🏥 طلب جديد - صيدلية النور\n${ls}\n📱 الهاتف: ${ph}\n📍 الموقع: ${lo}`;
 if(db)db.collection('orders').add({msg,ph,lo,at:Date.now()});
 window.open(`https://wa.me/${S.wa}?text=${encodeURIComponent(msg)}`);cart=[];go('home')}
function openWA(){window.open(`https://wa.me/${S.wa}`)}
// ===== الإدارة =====
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function login(){const pw=$('pw').value;let ok=false;
 if(db){try{await firebase.auth().signInWithEmailAndPassword('admin@noor.app',pw);ok=true}catch(e){ok=false}}else ok=(await sha(pw))==CFG.hash;
 if(!ok)return toast('رمز خاطئ');
 if(db)db.collection('orders').orderBy('at','desc').limit(30).onSnapshot(s=>{orders=s.docs.map(d=>d.data());if(v=='admin'&&tab=='ord')draw()},e=>console.log(e));go('admin')}
function logout(){if(db)firebase.auth().signOut();go('home')}
function adminV(){$('main').innerHTML=`<h3>⚙️ لوحة الإدارة</h3><div class="tabs"><button onclick="tab='meds';draw()">الأدوية</button><button onclick="tab='ord';draw()">الطلبات</button><button onclick="tab='set';draw()">الإعدادات</button><button class="o" onclick="logout()">خروج</button></div>`+(tab=='set'?setV():tab=='ord'?(orders.length?orders.map(o=>`<div class="glass row" style="white-space:pre-line;font-size:13px">${o.msg}</div>`).join(''):'<div class="glass row">لا طلبات (تحتاج Firebase)</div>'):
 `<div class="glass" style="padding:12px"><input type="hidden" id="eid"><input id="nm" placeholder="اسم الدواء"><input id="nt" placeholder="ملاحظة (اختياري)"><input type="file" id="fi" accept="image/*" onchange="pick(this,d=>{curImg=d;pv.src=d;pv.style.display='block'})"><img id="pv" style="display:none;width:80px;border-radius:10px;margin:4px 0"><label><input type="checkbox" id="av" checked style="width:auto"> متوفر</label><button onclick="saveMed()" style="width:100%">💾 حفظ</button></div><h3>📚 أدوية جاهزة (اضغط + للإضافة)</h3><div class="glass" style="padding:10px"><input id="cs" placeholder="🔍 ابحث في القائمة (عربي أو English)" oninput="catList()"><div id="cl"></div></div><h3>✅ أدويتك المضافة (${meds.length})</h3>`+meds.map(d=>`<div class="glass row"><div style="display:flex;gap:8px;align-items:center">${thumb(d)}<div><b>${d.name}</b><br><small>${d.av?'':'غير متوفر'}</small></div></div><span><button onclick="edit('${d.id}')">✏️</button> <button class="o" onclick="del('${d.id}')">🗑</button></span></div>`).join(''))}
function setV(){return `<div class="glass" style="padding:12px"><b>رقم واتساب استقبال الطلبات</b><input id="swa" type="tel" value="${S.wa}" placeholder="9647701234567"><small>بصيغة دولية بدون + أو أصفار</small><br><b>رقم الاتصال</b><input id="sph" type="tel" value="${S.phone}" placeholder="07701234567"><button onclick="saveS()" style="width:100%">💾 حفظ</button></div>`}
function saveS(){S={wa:swa.value.replace(/\D/g,''),phone:sph.value.trim()};if(db)db.collection('settings').doc('main').set(S);else localStorage.S=JSON.stringify(S);toast('تم الحفظ ✅')}
function edit(id){const d=meds.find(x=>x.id==id);eid.value=id;nm.value=d.name;nt.value=d.note||'';av.checked=d.av;curImg=d.img||'';if(curImg){pv.src=curImg;pv.style.display='block'}scrollTo(0,0)}
function saveMed(){const o={name:nm.value.trim(),note:nt.value,av:av.checked,img:curImg};if(!o.name)return toast('اكتب اسم الدواء');put(o,eid.value);curImg='';toast('تم الحفظ ✅')}
function del(id){ask('حذف هذا الدواء؟',()=>{if(db)db.collection('meds').doc(id).delete();else{meds=meds.filter(x=>x.id!=id);saveLocal();draw()}})}
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
