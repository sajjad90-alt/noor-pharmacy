const AM={'أ':'ا','إ':'ا','آ':'ا','ى':'ي','ة':'ه','ؤ':'و','ئ':'ي','ء':'','ق':'ك','ث':'س','ص':'س','ز':'س','ذ':'د','ض':'د','ظ':'د','ط':'ت'};
function norm(t){t=t.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآىةؤئءقثصزذضظط]/g,c=>AM[c]).replace(/ph/g,'f').replace(/ck/g,'k').replace(/ee/g,'i').replace(/o[ou]/g,'u').replace(/x/g,'ks').replace(/[pb]/g,'b').replace(/v/g,'f').replace(/[cq]/g,'k').replace(/z/g,'s').replace(/y/g,'i');
 return t.replace(/[^a-z0-9\u0621-\u064A]+/g,' ').replace(/([a-z\u0621-\u064A])\1+/g,'$1').trim()}
function ed(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function tsc(q,t){if(t.startsWith(q))return 1;if(/^\d/.test(q))return 0;if(q.length<3)return 0;if(t.includes(q))return .85;
 const a=1-ed(q,t)/Math.max(q.length,t.length),p=t.slice(0,q.length),b=(1-ed(q,p)/q.length)*.95;return Math.max(a,b)}
function smart(items,q,fn){const qt=norm(q).split(' ').filter(Boolean);if(!qt.length)return{list:items,fuzzy:false};
 const sc=items.map(x=>{const nt=norm(fn(x)).split(' ');return{x,s:qt.reduce((a,w)=>a+Math.max(0,...nt.map(t=>tsc(w,t))),0)/qt.length}}).sort((a,b)=>b.s-a.s);
 let r=sc.filter(o=>o.s>=.6);if(!r.length)r=sc.filter(o=>o.s>=.45).slice(0,3);
 return{list:r.map(o=>o.x),fuzzy:r.length>0&&r[0].s<.85}}

async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function login(){const pw=$('pw').value;let ok=false;
 if(db){try{await firebase.auth().signInWithEmailAndPassword('admin@noor.app',pw);ok=true}catch(e){ok=false}}else ok=(await sha(pw))==CFG.hash;
 if(!ok)return toast('رمز خاطئ');
 if(db)db.collection('orders').orderBy('at','desc').limit(30).onSnapshot(s=>{orders=s.docs.map(d=>d.data());if(v=='admin'&&tab=='ord')draw()},e=>console.log(e));go('admin')}
function logout(){if(db)firebase.auth().signOut();go('home')}
function adminV(){$('main').innerHTML=`<h3>⚙️ لوحة الإدارة</h3><div class="tabs"><button onclick="tab='meds';draw()">الأدوية</button><button onclick="tab='ord';draw()">الطلبات</button><button onclick="tab='set';draw()">الإعدادات</button><button class="o" onclick="logout()">خروج</button></div>`+(tab=='set'?setV():tab=='ord'?(orders.length?orders.map(o=>`<div class="glass row" style="white-space:pre-line;font-size:13px">${o.msg}</div>`).join(''):'<div class="glass row">لا طلبات (تحتاج Firebase)</div>'):
 `<div class="glass" style="padding:12px"><input type="hidden" id="eid"><input id="nm" placeholder="اسم الدواء"><input id="nt" placeholder="ملاحظة (اختياري)"><select id="gr"><option value="">التصنيف</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input type="file" id="fi" accept="image/*" onchange="pick(this,d=>{curImg=d;pv.src=d;pv.style.display='block'})"><img id="pv" style="display:none;width:80px;border-radius:10px;margin:4px 0"><label><input type="checkbox" id="av" checked style="width:auto"> متوفر</label><button onclick="saveMed()" style="width:100%">💾 حفظ (إضافة / تعديل)</button></div><h3>💊 كل الأدوية (${all().length})</h3><div class="glass" style="padding:10px"><input id="cs" placeholder="🔍 ابحث (عربي أو English)" value="${aq}" oninput="aq=this.value;ap=40;adminList()"><select id="cg" onchange="ag=this.value;ap=40;adminList()"><option value="">كل التصنيفات</option>${CATS.map(c=>`<option${c==ag?' selected':''}>${c}</option>`).join('')}</select><button class="o" style="width:100%;margin:4px 0" onclick="restore()">↩️ استرجاع المحذوف من القائمة (${(S.hidden||[]).length})</button><div id="cl"></div></div>`)}
function setV(){return `<div class="glass" style="padding:12px"><b>رقم واتساب استقبال الطلبات</b><input id="swa" type="tel" value="${S.wa}" placeholder="9647701234567"><small>بصيغة دولية بدون + أو أصفار</small><br><b>رقم الاتصال</b><input id="sph" type="tel" value="${S.phone}" placeholder="07701234567"><button onclick="saveS()" style="width:100%">💾 حفظ</button></div>`}
function saveS(){S={...S,wa:swa.value.replace(/\D/g,''),phone:sph.value.trim()};if(db)db.collection('settings').doc('main').set(S);else localStorage.S=JSON.stringify(S);toast('تم الحفظ ✅')}
function edit(id){const d=all().find(x=>x.id==id);if(!d)return;eid.value=id;nm.value=d.name;nt.value=d.note||'';gr.value=d.g||'';av.checked=d.av;curImg=d.img||'';curAl=d.al||'';if(curImg){pv.src=curImg;pv.style.display='block'}else pv.style.display='none';scrollTo(0,0)}
function saveMed(){const o={name:nm.value.trim(),note:nt.value,av:av.checked,img:curImg,g:gr.value,al:curAl};if(!o.name)return toast('اكتب اسم الدواء');
 const d=all().find(x=>x.id==eid.value),k=norm(o.name);
 if(all().some(x=>x!==d&&norm(x.name)==k))return toast('هذا الدواء موجود مسبقاً في القائمة');
 let id=eid.value;if(d&&d.m){id='';if(d.name!=o.name)hide(d.name)}else if(!d)id='';
 put(o,id);curImg='';curAl='';toast('تم الحفظ ✅');draw()}
function del(id){const d=all().find(x=>x.id==id);if(!d)return;ask('حذف هذا الدواء؟',()=>{if(!d.m){if(db)db.collection('meds').doc(id).delete();else{meds=meds.filter(x=>x.id!=id);saveLocal()}}
 if(d.m||MN.has(d.name))hide(d.name);else draw()})}
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
