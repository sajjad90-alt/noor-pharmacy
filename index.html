function add(id){const i=cart.find(c=>c.id==id);i?i.n++:cart.push({id,n:1});$('cc').textContent=`(${cart.length})`}
function cartV(){const t=cart.reduce((s,c)=>s+c.n*(meds.find(d=>d.id==c.id)?.price||0),0);
 $('main').innerHTML=`<h3>🛒 سلتي</h3>`+(cart.length?cart.map((c,i)=>{const d=meds.find(x=>x.id==c.id)||{name:'؟',price:0};return `<div class="glass row"><div><b>${d.name}</b><br><small>${fmt(d.price)}</small></div><span class="q"><button onclick="cart[${i}].n++;draw()">+</button> ${c.n} <button onclick="if(--cart[${i}].n<1)cart.splice(${i},1);draw()">−</button></span></div>`}).join('')+`<div class="glass" style="padding:14px"><b>المجموع: ${fmt(t)}</b>
 <input id="ph" type="tel" placeholder="📱 رقم هاتفك" value="${localStorage.ph||''}"><input id="lo" placeholder="📍 موقعك / عنوانك"><button onclick="gps()" style="width:100%;margin-bottom:8px">📍 تحديد موقعي تلقائياً</button>
 <button class="w" onclick="send()">إرسال الطلب عبر واتساب</button></div>`:'<div class="glass row">السلة فارغة</div>')}
function gps(){navigator.geolocation.getCurrentPosition(p=>$('lo').value=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`,()=>alert('فعّل خدمة الموقع'),{enableHighAccuracy:true})}
function send(){const ph=$('ph').value.trim(),lo=$('lo').value.trim();if(!S.wa)return alert('رقم الواتساب غير مضبوط من الإدارة');if(!ph||!lo)return alert('أدخل رقم الهاتف والموقع');localStorage.ph=ph;
 let t=0;const ls=cart.map(c=>{const d=meds.find(x=>x.id==c.id);t+=d.price*c.n;return `• ${d.name} × ${c.n} = ${fmt(d.price*c.n)}`}).join('\n');
 const msg=`🏥 طلب جديد - صيدلية النور\n${ls}\n💰 المجموع: ${fmt(t)}\n📱 الهاتف: ${ph}\n📍 الموقع: ${lo}`;
 if(db)db.collection('orders').add({msg,ph,lo,t,at:Date.now()});
 window.open(`https://wa.me/${S.wa}?text=${encodeURIComponent(msg)}`);cart=[];go('home')}
function openWA(){window.open(`https://wa.me/${S.wa}`)}
// ===== الإدارة =====
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function login(){const pw=$('pw').value;let ok=false;
 if(db){try{await firebase.auth().signInWithEmailAndPassword('admin@noor.app',pw);ok=true}catch(e){ok=false}}else ok=(await sha(pw))==CFG.hash;
 if(!ok)return alert('رمز خاطئ');
 if(db)db.collection('orders').orderBy('at','desc').limit(30).onSnapshot(s=>{orders=s.docs.map(d=>d.data());if(v=='admin'&&tab=='ord')draw()},e=>console.log(e));go('admin')}
function logout(){if(db)firebase.auth().signOut();go('home')}
function adminV(){$('main').innerHTML=`<h3>⚙️ لوحة الإدارة</h3><div class="tabs"><button onclick="tab='meds';draw()">الأدوية</button><button onclick="tab='ord';draw()">الطلبات</button><button onclick="tab='set';draw()">الإعدادات</button><button class="o" onclick="logout()">خروج</button></div>`+(tab=='set'?setV():tab=='ord'?(orders.length?orders.map(o=>`<div class="glass row" style="white-space:pre-line;font-size:13px">${o.msg}</div>`).join(''):'<div class="glass row">لا طلبات (تحتاج Firebase)</div>'):
 `<div class="glass" style="padding:12px"><input type="hidden" id="eid"><input id="nm" placeholder="اسم الدواء"><input id="pr" type="number" placeholder="السعر"><input id="nt" placeholder="ملاحظة (اختياري)"><input type="file" id="fi" accept="image/*" onchange="pick(this,d=>{curImg=d;pv.src=d;pv.style.display='block'})"><img id="pv" style="display:none;width:80px;border-radius:10px;margin:4px 0"><label><input type="checkbox" id="av" checked style="width:auto"> متوفر</label><button onclick="saveMed()" style="width:100%">💾 حفظ</button></div><h3>📚 أدوية جاهزة: اكتب السعر فقط</h3><div class="glass" style="padding:10px"><input id="cs" placeholder="🔍 ابحث في القائمة (عربي أو English)" oninput="catList()"><div id="cl"></div></div><h3>✅ أدويتك المضافة (${meds.length})</h3>`+meds.map(d=>`<div class="glass row"><div style="display:flex;gap:8px;align-items:center">${thumb(d)}<div><b>${d.name}</b><br><small>${fmt(d.price)} ${d.av?'':'• غير متوفر'}</small></div></div><span><button onclick="edit('${d.id}')">✏️</button> <button class="o" onclick="del('${d.id}')">🗑</button></span></div>`).join(''))}
function setV(){return `<div class="glass" style="padding:12px"><b>رقم واتساب استقبال الطلبات</b><input id="swa" type="tel" value="${S.wa}" placeholder="9647701234567"><small>بصيغة دولية بدون + أو أصفار</small><br><b>رقم الاتصال</b><input id="sph" type="tel" value="${S.phone}" placeholder="07701234567"><button onclick="saveS()" style="width:100%">💾 حفظ</button></div>`}
function saveS(){S={wa:swa.value.replace(/\D/g,''),phone:sph.value.trim()};if(db)db.collection('settings').doc('main').set(S);else localStorage.S=JSON.stringify(S);alert('تم الحفظ ✅')}
function edit(id){const d=meds.find(x=>x.id==id);eid.value=id;nm.value=d.name;pr.value=d.price;nt.value=d.note||'';av.checked=d.av;curImg=d.img||'';if(curImg){pv.src=curImg;pv.style.display='block'}scrollTo(0,0)}
function saveMed(){const o={name:nm.value.trim(),price:+pr.value,note:nt.value,av:av.checked,img:curImg};if(!o.name||!o.price)return alert('أكمل الاسم والسعر');put(o,eid.value);curImg='';alert('تم الحفظ ✅')}
function del(id){if(!confirm('حذف؟'))return;if(db)db.collection('meds').doc(id).delete();else{meds=meds.filter(x=>x.id!=id);saveLocal();draw()}}
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
